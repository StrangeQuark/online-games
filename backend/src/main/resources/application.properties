spring.application.name=afterhours-arcade
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/arcade}
spring.datasource.username=${DATABASE_USER:arcade}
spring.datasource.password=${DATABASE_PASSWORD:arcade_dev_only}
spring.sql.init.mode=always
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=ARCADE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=16KB
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
logging.level.root=INFO
logging.level.org.springframework=INFO
arcade.origins=${APP_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:${PORT:8080},http://127.0.0.1:${PORT:8080}}
